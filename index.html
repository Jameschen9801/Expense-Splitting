  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f2" />
    <script>
      // Apply only the display preference before paint; never read account data.
      (() => {
        let mode = 'system';
        try { mode = localStorage.getItem('warikan_appearance_v1') || 'system'; } catch {}
        const dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#171d1a' : '#f4f5f2';
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
